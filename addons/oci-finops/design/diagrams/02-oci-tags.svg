<text class="cardinality" x="488" y="508.5">1</text>
<text class="cardinality" x="1078" y="523">0..*</text>
<path class="fk" d="M 1330 248 L 1330 445"/>
<text class="cardinality" x="1340" y="268">1</text>
<text class="cardinality" x="1340" y="433">0..*</text>
<path class="fk" d="M 270 592 L 270 765"/>
<text class="cardinality" x="280" y="612">1</text>
<text class="cardinality" x="280" y="753">0..1</text>
<rect class="card" x="60" y="130" width="420" height="118" rx="8"/>
<path class="header" d="M 62 178 L 478 178 L 478 133 L 63 133 Z"/>
<line x1="60" y1="180" x2="480" y2="180" stroke="#476987" stroke-width="2"/>
