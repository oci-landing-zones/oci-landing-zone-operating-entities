<rect x="1371.75" y="1090" width="126.5" height="21" rx="4" fill="white"/>
<text x="1435" y="1105" text-anchor="middle" font-size="14">OCI module data</text>
<g id="ING" data-x="100" data-y="400">
<rect x="100" y="400" width="420" height="75" rx="12" fill="#f0edff" stroke="#9478e8" stroke-width="1.5"/>
<text x="310" y="431.5" text-anchor="middle" font-size="18">00 FOCUS ingestion</text>
<text x="310" y="455.5" text-anchor="middle" font-size="18">Landing and remediation</text>
</g>
<g id="TAG" data-x="590" data-y="400">
