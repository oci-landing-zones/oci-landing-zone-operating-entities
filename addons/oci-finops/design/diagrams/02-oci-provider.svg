<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
<title id="title">FinOps platform: shared foundation, OCI provider and OAC</title>
<desc id="desc">FinOps architecture. Shared schema and Common Core support all database modules. OCI includes the mandatory ingestion, tag catalog/profile and account context baseline, plus optional tag values, Budgets, Cloud Advisor, Anomalies and Forecast. The OAC database reporting module publishes costs and selected tags. The separate OAC service consumes that reporting interface and OCI module datasets. All arrows use the same style and show data consumption, not installation order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52617a"/></marker></defs>
<rect width="1600" height="1500" fill="white"/>
<g font-family="Arial, sans-serif" fill="#202b42">
<rect x="20" y="20" width="1560" height="1040" rx="14" fill="#ffffff" stroke="#a4b5cb"/>
<text x="800" y="48" text-anchor="middle" font-size="21">Oracle Autonomous Database (ADB)</text>
<rect x="60" y="70" width="1480" height="165" rx="14" fill="#f0f6fc" stroke="#93b1cf"/>
<text x="800" y="98" text-anchor="middle" font-size="21">Shared foundation - required by all database modules</text>
<g id="SCHEMA" data-x="100" data-y="125">
<rect x="100" y="125" width="420" height="80" rx="12" fill="#f0edff" stroke="#9478e8" stroke-width="1.5"/>
<text x="310" y="159" text-anchor="middle" font-size="18">00 Schema and access</text>
<text x="310" y="183" text-anchor="middle" font-size="18">FOCUSPLATFORM and OAC reader</text>
</g>
<g id="CORE" data-x="590" data-y="125">
<rect x="590" y="125" width="910" height="80" rx="12" fill="#f0edff" stroke="#9478e8" stroke-width="1.5"/>
<text x="1045" y="147" text-anchor="middle" font-size="18">01 Common Core - provider-neutral</text>
<text x="1045" y="171" text-anchor="middle" font-size="18">Provider registry | Daily reconciliation | Execution audit</text>
<text x="1045" y="195" text-anchor="middle" font-size="18">Shared schedule time zone | Optional operational notifications</text>
</g>
<text x="800" y="265" text-anchor="middle" font-size="17">OCI provider and OAC database modules use the shared schema and core shown above.</text>
<rect x="60" y="290" width="1480" height="515" rx="14" fill="#ffffff" stroke="#b6c2d6"/>
<text x="800" y="318" text-anchor="middle" font-size="21">OCI provider</text>
<rect x="80" y="345" width="1440" height="165" rx="14" fill="#faf8ff" stroke="#b8a8eb"/>
<text x="800" y="373" text-anchor="middle" font-size="21">Mandatory OCI functional baseline</text>
<rect x="80" y="590" width="1440" height="180" rx="14" fill="#f7faff" stroke="#bdcddd"/>
<text x="800" y="618" text-anchor="middle" font-size="21">Optional OCI extensions</text>
<rect x="100" y="880" width="1400" height="150" rx="14" fill="#f6fcf9" stroke="#9bc7b7"/>
<text x="800" y="908" text-anchor="middle" font-size="21">OAC database reporting module</text>
<rect x="300" y="1130" width="1000" height="260" rx="14" fill="#f6fcf9" stroke="#9bc7b7"/>
<text x="800" y="1158" text-anchor="middle" font-size="21">Oracle Analytics Cloud (OAC) service - outside ADB</text>
