name: Build and deploy Landing Zone Studio

on:
  pull_request:
    branches:
      - master
    paths:
      - "addons/landingzone-studio/**"
      - "gen/**"
      - ".github/workflows/deploy-landing-zone-studio.yml"
  push:
    branches:
      - master
    paths:
      - "addons/landingzone-studio/**"
      - "gen/**"
      - ".github/workflows/deploy-landing-zone-studio.yml"

permissions:
  contents: read

concurrency:
  group: landing-zone-studio-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate Pages build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: addons/landingzone-studio/3rd/go-jsonnet/go.mod
          cache-dependency-path: addons/landingzone-studio/3rd/go-jsonnet/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: addons/landingzone-studio
        run: bun ci

      - name: Lint
        working-directory: addons/landingzone-studio
        run: bun run lint

      - name: Test
        working-directory: addons/landingzone-studio
        run: bun run test

      - name: Type-check
        working-directory: addons/landingzone-studio
        run: bun run typecheck

      - name: Build GitHub Pages site
        working-directory: addons/landingzone-studio
        run: |
          bun run build:pages
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verify Pages artifact
        working-directory: addons/landingzone-studio
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -f dist/.nojekyll
          cmp dist/index.html dist/404.html
          grep -q '/oci-landing-zone-operating-entities/assets/' dist/index.html
          grep -q '/oci-landing-zone-operating-entities/favicon.svg' dist/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: addons/landingzone-studio/dist
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
